<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathe - Pantalla de Puntuación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0808, #1a0f0f, #2d1a1a, #3d2323);
            color: white;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(139, 69, 19, 0.2), transparent),
                radial-gradient(2px 2px at 60% 70%, rgba(160, 82, 45, 0.15), transparent),
                radial-gradient(1px 1px at 50% 50%, rgba(178, 34, 34, 0.1), transparent);
            background-size: 200px 200px, 300px 300px, 150px 150px;
            animation: dustFloat 60s linear infinite;
            pointer-events: none;
            opacity: 0.3;
            z-index: 0;
        }

        @keyframes dustFloat {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 200px 200px, -300px 300px, 150px -150px; }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(61, 35, 35, 0.4);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(139, 69, 19, 0.3);
            border: 2px solid rgba(160, 82, 45, 0.4);
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #e08d5c;
            text-shadow: 0 0 20px rgba(224, 141, 92, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
            letter-spacing: 6px;
        }

        @keyframes glow {
            from { 
                text-shadow: 0 0 15px rgba(224, 141, 92, 0.4);
            }
            to { 
                text-shadow: 0 0 25px rgba(224, 141, 92, 0.7);
            }
        }

        .subtitle {
            font-size: 1.5em;
            color: #7ecfb8;
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(126, 207, 184, 0.3);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 1.3em;
        }

        .stat-item {
            background: rgba(126, 207, 184, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid rgba(126, 207, 184, 0.5);
            box-shadow: 0 0 15px rgba(126, 207, 184, 0.2);
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #7ecfb8;
            text-shadow: 0 0 8px rgba(126, 207, 184, 0.5);
        }

        .tanks-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }

        .tank-card {
            background: rgba(61, 35, 35, 0.3);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 3px solid rgba(160, 82, 45, 0.4);
        }

        .tank-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 40px rgba(126, 207, 184, 0.4);
            border-color: #7ecfb8;
        }

        .tank-card.first {
            border-color: #ffd700;
            box-shadow: 0 5px 30px rgba(255, 215, 0, 0.5);
        }

        .tank-card.second {
            border-color: #c0c0c0;
            box-shadow: 0 5px 30px rgba(192, 192, 192, 0.4);
        }

        .tank-card.third {
            border-color: #cd7f32;
            box-shadow: 0 5px 30px rgba(205, 127, 50, 0.4);
        }

        .course-name {
            font-size: 1.8em;
            font-weight: bold;
            color: #e08d5c;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 0 0 8px rgba(224, 141, 92, 0.4);
        }

        .medal {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .tank-container {
            position: relative;
            width: 180px;
            height: 300px;
            border: 5px solid #7ecfb8;
            border-radius: 15px;
            background: rgba(20, 15, 15, 0.7);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(126, 207, 184, 0.3),
                        inset 0 0 15px rgba(0, 0, 0, 0.5);
            margin: 20px 0;
        }

        .oxygen-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(180deg, #5fb89d, #7ecfb8, #8fd9c3);
            transition: height 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8),
                         0 0 15px rgba(126, 207, 184, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        .oxygen-fill {
            animation: pulse 3s infinite;
        }

        .tank-stats {
            text-align: center;
            margin-top: 15px;
            width: 100%;
        }

        .points {
            font-size: 2em;
            color: #7ecfb8;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(126, 207, 184, 0.5);
        }

        .percentage {
            font-size: 1.2em;
            color: #9dd9c7;
            margin-top: 5px;
        }

        .ranking {
            background: rgba(61, 35, 35, 0.3);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(160, 82, 45, 0.4);
            box-shadow: 0 8px 32px rgba(139, 69, 19, 0.3);
        }

        .ranking h2 {
            color: #7ecfb8;
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 15px rgba(126, 207, 184, 0.4);
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .ranking-item {
            background: rgba(45, 26, 26, 0.5);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid rgba(160, 82, 45, 0.4);
            transition: all 0.3s;
        }

        .ranking-item:hover {
            border-color: #7ecfb8;
            transform: translateX(10px);
            box-shadow: 0 5px 20px rgba(126, 207, 184, 0.3);
        }

        .ranking-item.first {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        .ranking-item.second {
            background: rgba(192, 192, 192, 0.2);
            border-color: #c0c0c0;
            box-shadow: 0 5px 20px rgba(192, 192, 192, 0.25);
        }

        .ranking-item.third {
            background: rgba(205, 127, 50, 0.2);
            border-color: #cd7f32;
            box-shadow: 0 5px 20px rgba(205, 127, 50, 0.25);
        }

        .ranking-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .rank-position {
            font-size: 2em;
            font-weight: bold;
            color: #7ecfb8;
            min-width: 50px;
            text-shadow: 0 0 8px rgba(126, 207, 184, 0.4);
        }

        .rank-course {
            font-size: 1.5em;
            font-weight: bold;
            color: white;
        }

        .rank-points {
            font-size: 1.8em;
            font-weight: bold;
            color: #e08d5c;
            text-shadow: 0 0 8px rgba(224, 141, 92, 0.4);
        }

        .last-update {
            text-align: center;
            margin-top: 30px;
            color: #9dd9c7;
            font-size: 1.1em;
        }

        @media (max-width: 1400px) {
            .tanks-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 1100px) {
            .tanks-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            h1 {
                font-size: 2.5em;
            }

            .subtitle {
                font-size: 1.2em;
            }

            .tank-container {
                width: 150px;
                height: 250px;
            }

            .course-name {
                font-size: 1.5em;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1em;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }

            .stat-item {
                padding: 10px 20px;
            }

            .tanks-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .tank-card {
                padding: 15px;
            }

            .tank-container {
                width: 130px;
                height: 220px;
            }

            .course-name {
                font-size: 1.3em;
            }

            .medal {
                font-size: 2em;
            }

            .points {
                font-size: 1.5em;
            }

            .progress-bar {
                height: 25px;
            }

            .progress-text {
                font-size: 0.85em;
            }

            .oxygen-fill {
                font-size: 1.5em;
            }

            .ranking {
                padding: 20px;
            }

            .ranking h2 {
                font-size: 1.5em;
            }

            .rank-position {
                font-size: 1.5em;
                min-width: 40px;
            }

            .rank-course {
                font-size: 1.2em;
            }

            .rank-points {
                font-size: 1.3em;
            }

            .ranking-item {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            header {
                padding: 20px;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .subtitle {
                font-size: 0.9em;
            }

            .stat-value {
                font-size: 1.3em;
            }

            .tanks-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .tank-card {
                padding: 20px;
            }

            .tank-container {
                width: 160px;
                height: 240px;
            }

            .course-name {
                font-size: 1.4em;
            }

            .medal {
                font-size: 2em;
            }

            .points {
                font-size: 1.6em;
            }

            .progress-bar {
                height: 28px;
            }

            .progress-text {
                font-size: 0.9em;
            }

            .ranking {
                padding: 15px;
            }

            .ranking h2 {
                font-size: 1.3em;
                margin-bottom: 15px;
            }

            .ranking-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 15px;
            }

            .ranking-left {
                gap: 15px;
            }

            .rank-position {
                font-size: 1.8em;
            }

            .rank-course {
                font-size: 1.1em;
            }

            .rank-points {
                font-size: 1.5em;
            }

            .last-update {
                font-size: 0.9em;
            }
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 1.3em;
            }

            .tank-container {
                width: 140px;
                height: 220px;
            }

            .course-name {
                font-size: 1.2em;
            }
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(20, 15, 15, 0.7);
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
            border: 2px solid #7ecfb8;
            box-shadow: 0 0 12px rgba(126, 207, 184, 0.25),
                        inset 0 0 10px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #5fb89d, #7ecfb8, #8fd9c3);
            transition: width 1s ease-in-out;
            border-radius: 13px;
            box-shadow: 0 0 15px rgba(126, 207, 184, 0.4);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9), 
                         0 0 8px rgba(126, 207, 184, 0.6);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔴 BREATHE - MARS COLONY 💨</h1>
            <p class="subtitle">BASE MARS 2056 - Estado de Tanques de Oxígeno</p>
            <div class="stats">
                <div class="stat-item">
                    <div>Oxígeno Total</div>
                    <div class="stat-value" id="totalPoints">0</div>
                </div>
                <div class="stat-item">
                    <div>Códigos Activados</div>
                    <div class="stat-value" id="usedCodes">0</div>
                </div>
                <div class="stat-item">
                    <div>Supervivencia</div>
                    <div class="stat-value" id="globalProgress">0%</div>
                </div>
            </div>
        </header>

        <div class="tanks-grid" id="tanksGrid"></div>

        <div class="ranking">
            <h2>🏆 RANKING DE SUPERVIVENCIA - EQUIPOS MARS</h2>
            <div class="ranking-list" id="rankingList"></div>
        </div>

        <div class="last-update">
            Última actualización: <span id="lastUpdate">--:--:--</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // 2. Tu Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRbu8NsRZuvn1hVKoAYztaeyXEG_9g0KI",
            authDomain: "breath-8f51d.firebaseapp.com",
            databaseURL: "https://breath-8f51d-default-rtdb.firebaseio.com",
            projectId: "breath-8f51d",
            storageBucket: "breath-8f51d.firebasestorage.app",
            messagingSenderId: "115092733788",
            appId: "1:115092733788:web:908339b70a0f8113318b99"
        };

        // Inicializar Firebase y obtener la referencia a la base de datos
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Cursos estáticos (se usan para ordenar y asegurar todos los tanques)
        // Usamos el formato "3º ESO A" para mostrar, pero la clave en Firebase es "3º_ESO_A"
        const allCourses = ['3º ESO A', '3º ESO B', '3º ESO C', '3º ESO D', '3º ESO E'];
    </script>
    
    <script>
        // Función para calcular posiciones con empates
        function calculateRanks(sortedCourses) {
            const ranks = [];
            let currentRank = 1;
            
            for (let i = 0; i < sortedCourses.length; i++) {
                const [course, points] = sortedCourses[i];
                
                // Si no es el primero y tiene los mismos puntos que el anterior, mantiene el mismo rango
                if (i > 0 && sortedCourses[i][1] === sortedCourses[i-1][1]) {
                    ranks.push({ course, points, rank: ranks[i-1].rank });
                } else {
                    ranks.push({ course, points, rank: currentRank });
                }
                currentRank++;
            }
            
            return ranks;
        }

        // Función de ayuda para la medalla según el rango
        function getMedalByRank(rank) {
            const medals = {
                1: '🥇',
                2: '🥈',
                3: '🥉',
                4: '4️⃣',
                5: '5️⃣'
            };
            return medals[rank] || '📊';
        }

        // Función de ayuda para la clase CSS según el rango
        function getClassByRank(rank) {
            if (rank === 1) return 'first';
            if (rank === 2) return 'second';
            if (rank === 3) return 'third';
            return '';
        }

        // Función principal que lee Firebase y actualiza la pantalla
        async function updateDisplay() {
            try {
                // Leer todos los datos de la raíz de la BD (USANDO FIREBASE)
                const snapshot = await db.ref('/').once('value');
                const data = snapshot.val() || {};
                
                // Extraer puntos de cursos y códigos usados
                // Normalizamos los cursos: la clave en Firebase usa '_' pero para mostrar usamos ' '
                let coursePoints = {};
                
                // Mapear los puntos de las claves normalizadas (3º_ESO_A) a nombres legibles (3º ESO A)
                const firebaseCourses = data.courses || {};
                allCourses.forEach(course => {
                    const courseKey = course.replace(/\s/g, '_');
                    // Si el punto no existe en Firebase, usamos 0
                    coursePoints[course] = firebaseCourses[courseKey] || 0; 
                });

                const usedCodes = data.usedCodes || [];
                
                // Calcular estadísticas globales
                const totalPoints = Object.values(coursePoints).reduce((sum, points) => sum + points, 0);
                
                document.getElementById('totalPoints').textContent = totalPoints;
                document.getElementById('usedCodes').textContent = usedCodes.length;
                
                // Calcular progreso global (1000 puntos = 100%)
                const globalProgress = Math.min(100, Math.floor((totalPoints / 1000) * 100));
                document.getElementById('globalProgress').textContent = globalProgress + '%';
                
                // Ordenar cursos por puntos (de mayor a menor)
                const sortedCourses = Object.entries(coursePoints).sort((a, b) => b[1] - a[1]);
                
                // Calcular rangos con empates
                const rankedCourses = calculateRanks(sortedCourses);
                
                // Actualizar tanques
                const tanksGrid = document.getElementById('tanksGrid');
                tanksGrid.innerHTML = '';
                
                rankedCourses.forEach(({ course, points, rank }) => {
                    const percentage = Math.min(100, Math.floor((points / 100) * 100));
                    const medal = getMedalByRank(rank);
                    const rankClass = getClassByRank(rank);
                    
                    const tankCard = document.createElement('div');
                    tankCard.className = `tank-card ${rankClass}`;
                    tankCard.innerHTML = `
                        <div class="medal">${medal}</div>
                        <div class="course-name">${course}</div>
                        <div class="tank-container">
                            <div class="oxygen-fill" style="height: ${percentage}%">
                                <span>${percentage}%</span>
                            </div>
                        </div>
                        <div class="tank-stats">
                            <div class="points">${points} pts</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percentage}%"></div>
                                <div class="progress-text">${percentage}%</div>
                            </div>
                        </div>
                    `;
                    tanksGrid.appendChild(tankCard);
                });
                
                // Actualizar ranking
                const rankingList = document.getElementById('rankingList');
                rankingList.innerHTML = '';
                
                rankedCourses.forEach(({ course, points, rank }) => {
                    const rankClass = getClassByRank(rank);
                    const medal = getMedalByRank(rank);
                    const percentage = totalPoints > 0 ? Math.round((points / totalPoints) * 100) : 0;
                    
                    const rankItem = document.createElement('div');
                    rankItem.className = `ranking-item ${rankClass}`;
                    rankItem.innerHTML = `
                        <div class="ranking-left">
                            <div class="rank-position">${medal}</div>
                            <div class="rank-course">${course}</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="rank-points">${points} puntos</div>
                            <div class="percentage">${percentage}% del total</div>
                        </div>
                    `;
                    rankingList.appendChild(rankItem);
                });
                
                // Actualizar hora
                const now = new Date();
                document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('es-ES');
                
            } catch (error) {
                console.error("Error al obtener datos de Firebase:", error);
                // Si hay un error, actualizamos la hora para que el usuario sepa que no está congelado
                document.getElementById('lastUpdate').textContent = 'Error de conexión (' + new Date().toLocaleTimeString('es-ES') + ')';
            }
        }

        // Actualizar cada 3 segundos
        updateDisplay();
        setInterval(updateDisplay, 3000);
    </script>
</body>
</html>
