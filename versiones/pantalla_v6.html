<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathe - Pantalla de Puntuación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0015, #1a0b3d, #2d1560, #4a1a80);
            color: white;
            height: 100vh;
            padding: 15px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(138, 43, 226, 0.2), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(0, 191, 255, 0.15), transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(255, 20, 147, 0.1), transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.8; }
        }

        .mars-icon {
            width: 50px;
            height: 50px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
            filter: drop-shadow(0 0 10px rgba(255, 107, 74, 0.6));
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            padding: 15px;
            background: rgba(74, 26, 128, 0.5);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.4);
            border: 3px solid rgba(255, 140, 100, 0.4);
        }

        h1 {
            font-size: 2em;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff8c00, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            letter-spacing: 4px;
        }

        .subtitle {
            font-size: 0.95em;
            color: #5dade2;
            text-shadow: 0 0 10px rgba(93, 173, 226, 0.6);
        }

        /* TARJETAS DE ESTADÍSTICAS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat-card {
            background: rgba(74, 26, 128, 0.5);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card.total {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
        }

        .stat-card.codes {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
        }

        .stat-card.progress {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.15);
        }

        .stat-card.leader {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.15);
        }

        .stat-card h3 {
            font-size: 0.75em;
            margin-bottom: 6px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .number {
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 0 0 15px currentColor;
        }

        .stat-card.total .number { color: #2ecc71; }
        .stat-card.codes .number { color: #e74c3c; }
        .stat-card.progress .number { color: #f39c12; }
        .stat-card.leader .number { 
            color: #00d4ff; 
            font-size: 1.3em;
            line-height: 1.2;
        }

        .stat-card .icon {
            font-size: 1.3em;
            margin-top: 4px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }

        .stat-card .subtitle-text {
            font-size: 0.65em;
            margin-top: 4px;
            opacity: 0.8;
        }

        /* CONTENIDO PRINCIPAL */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* SECCIÓN DE TANQUES */
        .tanks-section {
            background: rgba(74, 26, 128, 0.4);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(138, 43, 226, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .tanks-section h2 {
            color: #00d4ff;
            margin-bottom: 12px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .tanks-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            flex: 1;
            align-items: center;
        }

        /* TARJETA DE TANQUE VERTICAL */
        .tank-card {
            background: rgba(10, 0, 21, 0.6);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s;
            border: 2px solid rgba(138, 43, 226, 0.5);
            height: 100%;
            justify-content: space-between;
        }

        .tank-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
            border-color: #00d4ff;
        }

        .tank-card.first {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            animation: winner-glow 1.5s ease-in-out infinite;
        }

        @keyframes winner-glow {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            }
            50% { 
                box-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 0 60px rgba(255, 215, 0, 0.5);
            }
        }

        .tank-card.second {
            border-color: #c0c0c0;
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.3);
        }

        .tank-card.third {
            border-color: #cd7f32;
            box-shadow: 0 0 20px rgba(205, 127, 50, 0.3);
        }

        .medal {
            font-size: 2.5em;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.7));
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .course-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #ff1493;
            margin-bottom: 8px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.6);
        }

        /* TANQUE VERTICAL */
        .tank-container {
            position: relative;
            width: 100%;
            max-width: 110px;
            height: 180px;
            border: 3px solid #00d4ff;
            border-radius: 10px;
            background: rgba(10, 0, 21, 0.9);
            overflow: hidden;
            box-shadow: 
                0 0 20px rgba(0, 212, 255, 0.4),
                inset 0 0 15px rgba(0, 0, 0, 0.7);
            margin: 10px 0;
        }

        .oxygen-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(180deg, #00bfff, #00d4ff, #5dd9ff);
            transition: height 1s ease-in-out;
            box-shadow: 0 -5px 20px rgba(0, 212, 255, 0.5);
        }

        .tank-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            font-weight: bold;
            color: white;
            text-shadow: 
                0 0 20px rgba(0, 0, 0, 1),
                0 0 8px rgba(0, 212, 255, 1);
            z-index: 10;
        }

        .tank-points {
            font-size: 1.1em;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            margin-top: 8px;
        }

        /* PIE DE PÁGINA */
        .last-update {
            text-align: center;
            padding: 8px;
            background: rgba(74, 26, 128, 0.3);
            border-radius: 10px;
            color: #5dade2;
            font-size: 0.85em;
            border: 2px solid rgba(93, 173, 226, 0.3);
            margin-top: 10px;
        }

        /* RESPONSIVE */
        @media (max-width: 1400px) {
            .tanks-grid {
                gap: 10px;
            }
            
            .tank-container {
                max-width: 90px;
                height: 160px;
            }
            
            .tank-percentage {
                font-size: 1.6em;
            }
        }

        @media (max-width: 1200px) {
            .tanks-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5em;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .tanks-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <svg class="mars-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="marsGradient" cx="35%" cy="35%">
                            <stop offset="0%" style="stop-color:#ff8c5a;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#e74c3c;stop-opacity:1" />
                            <stop offset="80%" style="stop-color:#c0392b;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8b1a0f;stop-opacity:1" />
                        </radialGradient>
                    </defs>
                    <circle cx="50" cy="50" r="48" fill="url(#marsGradient)" stroke="#ff6b4a" stroke-width="2"/>
                    <circle cx="30" cy="35" r="10" fill="#a0321e" opacity="0.6"/>
                    <circle cx="68" cy="42" r="7" fill="#a0321e" opacity="0.5"/>
                    <circle cx="48" cy="68" r="12" fill="#a0321e" opacity="0.7"/>
                    <circle cx="65" cy="65" r="6" fill="#8b1a0f" opacity="0.5"/>
                    <ellipse cx="50" cy="50" rx="25" ry="4" fill="#7a1610" opacity="0.4" transform="rotate(-20 50 50)"/>
                    <ellipse cx="50" cy="15" rx="18" ry="8" fill="#ffffff" opacity="0.4"/>
                </svg>
                PROYECTO BREATHE
            </h1>
            <p class="subtitle">🚀 Misión Mars 2056 - Niveles de Oxígeno 💨</p>
        </header>

        <!-- TARJETAS DE ESTADÍSTICAS -->
        <div class="stats-grid">
            <div class="stat-card total">
                <h3>Oxígeno Total</h3>
                <div class="number" id="totalPoints">0</div>
                <div class="icon">💨</div>
            </div>
            <div class="stat-card codes">
                <h3>Códigos Activados</h3>
                <div class="number" id="usedCodes">0</div>
                <div class="icon">🔑</div>
            </div>
            <div class="stat-card progress">
                <h3>Progreso Global</h3>
                <div class="number" id="globalProgress">0%</div>
                <div class="subtitle-text">Meta: 1000 pts</div>
                <div class="icon">📈</div>
            </div>
            <div class="stat-card leader">
                <h3>Líder Actual</h3>
                <div class="number" id="leaderName">-</div>
                <div class="subtitle-text" id="leaderPoints">0 puntos</div>
                <div class="icon">🏆</div>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="main-content">
            <!-- TANQUES VERTICALES -->
            <div class="tanks-section">
                <h2>💨 Tanques de Oxígeno - Equipos Mars</h2>
                <div class="tanks-grid" id="tanksGrid"></div>
            </div>
        </div>

        <!-- PIE DE PÁGINA -->
        <div class="last-update">
            🕐 Última actualización: <span id="lastUpdate">--:--:--</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRbu8NsRZuvn1hVKoAYztaeyXEG_9g0KI",
            authDomain: "breath-8f51d.firebaseapp.com",
            databaseURL: "https://breath-8f51d-default-rtdb.firebaseio.com",
            projectId: "breath-8f51d",
            storageBucket: "breath-8f51d.firebasestorage.app",
            messagingSenderId: "115092733788",
            appId: "1:115092733788:web:908339b70a0f8113318b99"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        const allCourses = ['3º ESO A', '3º ESO B', '3º ESO C', '3º ESO D', '3º ESO E', '3º ESO F'];

        function calculateRanks(sortedCourses) {
            const ranks = [];
            let currentRank = 1;
            
            for (let i = 0; i < sortedCourses.length; i++) {
                const [course, points] = sortedCourses[i];
                
                if (i > 0 && sortedCourses[i][1] === sortedCourses[i-1][1]) {
                    ranks.push({ course, points, rank: ranks[i-1].rank });
                } else {
                    ranks.push({ course, points, rank: currentRank });
                }
                currentRank++;
            }
            
            return ranks;
        }

        function getMedalByRank(rank) {
            const medals = {
                1: '🥇',
                2: '🥈',
                3: '🥉',
                4: '4️⃣',
                5: '5️⃣',
                6: '6️⃣'
            };
            return medals[rank] || '📊';
        }

        function getClassByRank(rank) {
            if (rank === 1) return 'first';
            if (rank === 2) return 'second';
            if (rank === 3) return 'third';
            return '';
        }

        async function updateDisplay() {
            try {
                const snapshot = await db.ref('/').once('value');
                const data = snapshot.val() || {};
                
                let coursePoints = {};
                
                const firebaseCourses = data.courses || {};
                allCourses.forEach(course => {
                    const courseKey = course.replace(/\s/g, '_');
                    coursePoints[course] = firebaseCourses[courseKey] || 0; 
                });

                const usedCodes = data.usedCodes || [];
                
                const totalPoints = Object.values(coursePoints).reduce((sum, points) => sum + points, 0);
                
                // Actualizar estadísticas principales
                document.getElementById('totalPoints').textContent = totalPoints;
                document.getElementById('usedCodes').textContent = usedCodes.length;
                
                const globalProgress = Math.min(100, Math.floor((totalPoints / 1000) * 100));
                document.getElementById('globalProgress').textContent = globalProgress + '%';
                
                const sortedCourses = Object.entries(coursePoints).sort((a, b) => b[1] - a[1]);
                const rankedCourses = calculateRanks(sortedCourses);
                
                // Actualizar líder (manejar empates)
                if (rankedCourses.length > 0) {
                    const maxPoints = rankedCourses[0].points;
                    const leaders = rankedCourses.filter(item => item.points === maxPoints);
                    
                    if (leaders.length === 1) {
                        document.getElementById('leaderName').textContent = leaders[0].course;
                        document.getElementById('leaderPoints').textContent = leaders[0].points + ' puntos';
                    } else {
                        // Empate - mostrar todos los líderes
                        const leaderNames = leaders.map(l => l.course).join(', ');
                        document.getElementById('leaderName').textContent = leaderNames;
                        document.getElementById('leaderPoints').textContent = maxPoints + ' puntos (EMPATE)';
                    }
                }
                
                // Actualizar tanques verticales
                const tanksGrid = document.getElementById('tanksGrid');
                tanksGrid.innerHTML = '';
                
                rankedCourses.forEach(({ course, points, rank }) => {
                    const percentage = Math.min(100, Math.floor((points / 1000) * 100));
                    const medal = getMedalByRank(rank);
                    const rankClass = getClassByRank(rank);
                    
                    const tankCard = document.createElement('div');
                    tankCard.className = `tank-card ${rankClass}`;
                    tankCard.innerHTML = `
                        <div class="medal">${medal}</div>
                        <div class="course-name">${course}</div>
                        <div class="tank-container">
                            <div class="oxygen-fill" style="height: ${percentage}%"></div>
                            <div class="tank-percentage">${percentage}%</div>
                        </div>
                        <div class="tank-points">${points} pts</div>
                    `;
                    tanksGrid.appendChild(tankCard);
                });
                
                // Actualizar timestamp
                const now = new Date();
                document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('es-ES');
                
            } catch (error) {
                console.error("Error al obtener datos de Firebase:", error);
                document.getElementById('lastUpdate').textContent = 'Error de conexión (' + new Date().toLocaleTimeString('es-ES') + ')';
            }
        }

        // Inicializar y actualizar cada 3 segundos
        updateDisplay();
        setInterval(updateDisplay, 3000);
    </script>
</body>
</html>
