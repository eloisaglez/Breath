<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breath - Pantalla de Puntuación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #ff6b6b;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 107, 107, 0.5); }
            to { text-shadow: 0 0 40px rgba(255, 107, 107, 1); }
        }

        .subtitle {
            font-size: 1.5em;
            color: #a8dadc;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 1.3em;
        }

        .stat-item {
            background: rgba(78, 205, 196, 0.2);
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #4ecdc4;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #4ecdc4;
        }

        .firebase-status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 1em;
        }

        .firebase-status.connected {
            background: rgba(76, 175, 80, 0.2);
            color: #a5d6a7;
        }

        .firebase-status.disconnected {
            background: rgba(244, 67, 54, 0.2);
            color: #ef9a9a;
        }

        .tanks-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }

        .tank-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 3px solid transparent;
        }

        .tank-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 40px rgba(78, 205, 196, 0.5);
            border-color: #4ecdc4;
        }

        .tank-card.first {
            border-color: #ffd700;
            box-shadow: 0 5px 30px rgba(255, 215, 0, 0.4);
        }

        .tank-card.second {
            border-color: #c0c0c0;
            box-shadow: 0 5px 30px rgba(192, 192, 192, 0.4);
        }

        .tank-card.third {
            border-color: #cd7f32;
            box-shadow: 0 5px 30px rgba(205, 127, 50, 0.4);
        }

        .course-name {
            font-size: 1.8em;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 15px;
            text-align: center;
        }

        .medal {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .tank-container {
            position: relative;
            width: 180px;
            height: 300px;
            border: 5px solid #4ecdc4;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.3);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
            margin: 20px 0;
        }

        .oxygen-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(180deg, #00d4ff, #0099cc);
            transition: height 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .oxygen-fill {
            animation: pulse 3s infinite;
        }

        .tank-stats {
            text-align: center;
            margin-top: 15px;
        }

        .points {
            font-size: 2em;
            color: #4ecdc4;
            font-weight: bold;
        }

        .percentage {
            font-size: 1.2em;
            color: #a8dadc;
            margin-top: 5px;
        }

        .ranking {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .ranking h2 {
            color: #4ecdc4;
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .ranking-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .ranking-item:hover {
            border-color: #4ecdc4;
            transform: translateX(10px);
        }

        .ranking-item.first {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }

        .ranking-item.second {
            background: rgba(192, 192, 192, 0.2);
            border-color: #c0c0c0;
        }

        .ranking-item.third {
            background: rgba(205, 127, 50, 0.2);
            border-color: #cd7f32;
        }

        .ranking-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .rank-position {
            font-size: 2em;
            font-weight: bold;
            color: #4ecdc4;
            min-width: 50px;
        }

        .rank-course {
            font-size: 1.5em;
            font-weight: bold;
            color: white;
        }

        .rank-points {
            font-size: 1.8em;
            font-weight: bold;
            color: #ff6b6b;
        }

        .last-update {
            text-align: center;
            margin-top: 30px;
            color: #a8dadc;
            font-size: 1.1em;
        }

        @media (max-width: 1400px) {
            .tanks-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .tanks-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            h1 {
                font-size: 2em;
            }
        }

        @media (max-width: 600px) {
            .tanks-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
            border: 2px solid #4ecdc4;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            transition: width 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌬️ BREATH 💨</h1>
            <p class="subtitle">Competición 3º ESO - Estado de los Tanques</p>
            <div class="stats">
                <div class="stat-item">
                    <div>Total Oxígeno</div>
                    <div class="stat-value" id="totalPoints">0</div>
                </div>
                <div class="stat-item">
                    <div>Códigos Usados</div>
                    <div class="stat-value" id="usedCodes">0</div>
                </div>
                <div class="stat-item">
                    <div>Progreso Global</div>
                    <div class="stat-value" id="globalProgress">0%</div>
                </div>
            </div>
            <div id="firebaseStatus" class="firebase-status">Conectando...</div>
        </header>

        <div class="tanks-grid" id="tanksGrid"></div>

        <div class="ranking">
            <h2>🏆 Clasificación General</h2>
            <div class="ranking-list" id="rankingList"></div>
        </div>

        <div class="last-update">
            Última actualización: <span id="lastUpdate">--:--:--</span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ============================================
        // CONFIGURACIÓN DE FIREBASE
        // ⚠️ REEMPLAZA ESTO CON TU CONFIGURACIÓN
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBRbu8NsRZuvn1hVKoAYztaeyXEG_9g0KI",
            authDomain: "breath-8f51d.firebaseapp.com",
            databaseURL: "https://breath-8f51d-default-rtdb.firebaseio.com",
            projectId: "breath-8f51d",
            storageBucket: "breath-8f51d.firebasestorage.app",
            messagingSenderId: "115092733788",
            appId: "1:115092733788:web:908339b70a0f8113318b99"
        };

        // Inicializar Firebase
        let db;
        let isFirebaseConfigured = false;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            isFirebaseConfigured = true;
            
            // Verificar conexión
            const connectedRef = db.ref('.info/connected');
            connectedRef.on('value', (snap) => {
                const statusDiv = document.getElementById('firebaseStatus');
                if (snap.val() === true) {
                    statusDiv.className = 'firebase-status connected';
                    statusDiv.textContent = '🟢 Conectado - Actualizaciones en tiempo real';
                } else {
                    statusDiv.className = 'firebase-status disconnected';
                    statusDiv.textContent = '🔴 Sin conexión';
                }
            });

            // Escuchar cambios en tiempo real
            db.ref('breathData').on('value', (snapshot) => {
                updateDisplay();
            });

        } catch (error) {
            console.warn('Firebase no configurado:', error.message);
            const statusDiv = document.getElementById('firebaseStatus');
            statusDiv.className = 'firebase-status disconnected';
            statusDiv.textContent = '⚠️ Firebase no configurado - Usando modo local';
            isFirebaseConfigured = false;
            
            // Sin Firebase, actualizar cada 3 segundos
            setInterval(updateDisplay, 3000);
        }

        // ============================================
        // FUNCIONES DE VISUALIZACIÓN
        // ============================================

        async function getData() {
            if (isFirebaseConfigured) {
                try {
                    const snapshot = await db.ref('breathData').once('value');
                    const data = snapshot.val();
                    
                    if (!data) {
                        return {
                            courses: {
                                '3º ESO A': 0,
                                '3º ESO B': 0,
                                '3º ESO C': 0,
                                '3º ESO D': 0,
                                '3º ESO E': 0
                            },
                            totalPoints: 0,
                            usedCodes: []
                        };
                    }
                    
                    return data;
                } catch (error) {
                    console.error('Error obteniendo datos de Firebase:', error);
                    return getLocalData();
                }
            } else {
                return getLocalData();
            }
        }

        function getLocalData() {
            const data = localStorage.getItem('breathData');
            if (!data) {
                return {
                    courses: {
                        '3º ESO A': 0,
                        '3º ESO B': 0,
                        '3º ESO C': 0,
                        '3º ESO D': 0,
                        '3º ESO E': 0
                    },
                    totalPoints: 0,
                    usedCodes: []
                };
            }
            return JSON.parse(data);
        }

        function getMedal(index) {
            const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
            return medals[index] || '📊';
        }

        function getClass(index) {
            if (index === 0) return 'first';
            if (index === 1) return 'second';
            if (index === 2) return 'third';
            return '';
        }

        async function updateDisplay() {
            const data = await getData();
            
            // Actualizar estadísticas globales
            document.getElementById('totalPoints').textContent = data.totalPoints;
            document.getElementById('usedCodes').textContent = data.usedCodes.length;
            
            // Calcular progreso global (1000 puntos = 100%)
            const globalProgress = Math.min(100, Math.floor((data.totalPoints / 1000) * 100));
            document.getElementById('globalProgress').textContent = globalProgress + '%';
            
            // Ordenar cursos por puntos
            const sortedCourses = Object.entries(data.courses).sort((a, b) => b[1] - a[1]);
            
            // Actualizar tanques
            const tanksGrid = document.getElementById('tanksGrid');
            tanksGrid.innerHTML = '';
            
            sortedCourses.forEach(([course, points], index) => {
                const percentage = Math.min(100, Math.floor((points / 100) * 100));
                const medal = getMedal(index);
                const rankClass = getClass(index);
                
                const tankCard = document.createElement('div');
                tankCard.className = `tank-card ${rankClass}`;
                tankCard.innerHTML = `
                    <div class="medal">${medal}</div>
                    <div class="course-name">${course}</div>
                    <div class="tank-container">
                        <div class="oxygen-fill" style="height: ${percentage}%">
                            <span>${percentage}%</span>
                        </div>
                    </div>
                    <div class="tank-stats">
                        <div class="points">${points} pts</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percentage}%">
                                ${percentage}%
                            </div>
                        </div>
                    </div>
                `;
                tanksGrid.appendChild(tankCard);
            });
            
            // Actualizar ranking
            const rankingList = document.getElementById('rankingList');
            rankingList.innerHTML = '';
            
            sortedCourses.forEach(([course, points], index) => {
                const rankClass = getClass(index);
                const medal = getMedal(index);
                const percentage = data.totalPoints > 0 ? Math.round((points / data.totalPoints) * 100) : 0;
                
                const rankItem = document.createElement('div');
                rankItem.className = `ranking-item ${rankClass}`;
                rankItem.innerHTML = `
                    <div class="ranking-left">
                        <div class="rank-position">${medal}</div>
                        <div class="rank-course">${course}</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="rank-points">${points} puntos</div>
                        <div class="percentage">${percentage}% del total</div>
                    </div>
                `;
                rankingList.appendChild(rankItem);
            });
            
            // Actualizar hora
            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('es-ES');
        }

        // Inicializar
        updateDisplay();

        // Si no está configurado Firebase, actualizar cada 3 segundos
        if (!isFirebaseConfigured) {
            setInterval(updateDisplay, 3000);
        }
    </script>
</body>
</html>
