<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathe - Pantalla de Puntuación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0015, #1a0b3d, #2d1560, #4a1a80);
            color: white;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(138, 43, 226, 0.2), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(0, 191, 255, 0.15), transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(255, 20, 147, 0.1), transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite;
        }

        /* Paneles laterales ELIMINADOS */

        /* Icono de Marte SVG */
        .mars-icon {
            width: 60px;
            height: 60px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 15px;
            filter: drop-shadow(0 0 10px rgba(255, 107, 74, 0.6));
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(74, 26, 128, 0.5);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.4);
            border: 2px solid rgba(255, 20, 147, 0.5);
        }

        h1 {
            font-size: 2em;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff8c00, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 140, 0, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
            letter-spacing: 4px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
        }

        @keyframes glow {
            from { 
                filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.6));
            }
            to { 
                filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1));
            }
        }

        .subtitle {
            font-size: 1em;
            color: #00bfff;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.6);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 1em;
        }

        .stat-item {
            background: rgba(0, 212, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid rgba(0, 212, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.8);
        }

        .tanks-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 18px;
            margin-bottom: 20px;
        }

        .tank-card {
            background: rgba(74, 26, 128, 0.4);
            padding: 12px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 3px solid rgba(138, 43, 226, 0.5);
        }

        .tank-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.5);
            border-color: #00d4ff;
        }

        .tank-card.first {
            border-color: #ffd700;
            box-shadow: 0 5px 30px rgba(255, 215, 0, 0.7);
            animation: winner 2s ease-in-out infinite;
        }

        @keyframes winner {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .tank-card.second {
            border-color: #c0c0c0;
            box-shadow: 0 5px 30px rgba(192, 192, 192, 0.5);
        }

        .tank-card.third {
            border-color: #cd7f32;
            box-shadow: 0 5px 30px rgba(205, 127, 50, 0.5);
        }

        .course-name {
            font-size: 1.6em;
            font-weight: bold;
            color: #ff1493;
            margin-bottom: 12px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 20, 147, 0.7);
        }

        .medal {
            font-size: 2.8em;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.8));
        }

        .tank-container {
            position: relative;
            width: 140px;
            height: 240px;
            border: 5px solid #00d4ff;
            border-radius: 15px;
            background: rgba(10, 0, 21, 0.9);
            overflow: visible;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4),
                        inset 0 0 20px rgba(0, 0, 0, 0.7);
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .oxygen-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(180deg, #00bfff, #00d4ff, #5dd9ff, #87ceeb);
            transition: height 1s ease-in-out;
            box-shadow: 0 -5px 30px rgba(0, 212, 255, 0.6);
            border-radius: 0 0 10px 10px;
        }

        .tank-percentage {
            position: relative;
            z-index: 10;
            font-size: 2.2em;
            font-weight: bold;
            color: white;
            text-shadow: 
                0 0 20px rgba(0, 0, 0, 1),
                0 0 40px rgba(0, 212, 255, 1),
                3px 3px 8px rgba(0, 0, 0, 1),
                -2px -2px 8px rgba(0, 0, 0, 1);
            padding: 12px;
            background: rgba(10, 0, 21, 0.6);
            border-radius: 10px;
        }

        @keyframes pulse {
            0%, 100% { 
                opacity: 1;
                box-shadow: 0 -5px 30px rgba(0, 212, 255, 0.6);
            }
            50% { 
                opacity: 0.9;
                box-shadow: 0 -5px 40px rgba(0, 212, 255, 0.9);
            }
        }

        .oxygen-fill {
            animation: pulse 2s infinite;
        }

        .tank-stats {
            text-align: center;
            margin-top: 8px;
            width: 100%;
        }

        .points {
            font-size: 1.6em;
            color: #00d4ff;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.8);
        }

        .percentage {
            font-size: 1.2em;
            color: #5dd9ff;
            margin-top: 5px;
        }

        .last-update {
            text-align: center;
            margin-top: 20px;
            color: #00bfff;
            font-size: 0.95em;
        }

        @media (max-width: 1400px) {
            .tanks-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 1100px) {
            /* Permitir scroll en tablets y móviles */
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            
            .tanks-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            h1 {
                font-size: 2.5em;
            }

            .subtitle {
                font-size: 1.2em;
            }

            .tank-container {
                width: 150px;
                height: 250px;
            }

            .course-name {
                font-size: 1.5em;
            }

            .container {
                padding: 0 20px;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1em;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }

            .stat-item {
                padding: 10px 20px;
            }

            .tanks-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .tank-card {
                padding: 15px;
            }

            .tank-container {
                width: 130px;
                height: 220px;
            }

            .course-name {
                font-size: 1.3em;
            }

            .medal {
                font-size: 2em;
            }

            .points {
                font-size: 1.5em;
            }

            .progress-bar {
                height: 25px;
            }

            .progress-text {
                font-size: 0.85em;
            }

            .tank-percentage {
                font-size: 1.8em;
            }

            .container {
                padding: 0 10px;
            }

            .mars-icon {
                width: 40px;
                height: 40px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            header {
                padding: 20px;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .subtitle {
                font-size: 0.9em;
            }

            .stat-value {
                font-size: 1.3em;
            }

            .tanks-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .tank-card {
                padding: 20px;
            }

            .tank-container {
                width: 160px;
                height: 240px;
            }

            .course-name {
                font-size: 1.4em;
            }

            .medal {
                font-size: 2em;
            }

            .points {
                font-size: 1.6em;
            }

            .progress-bar {
                height: 28px;
            }

            .progress-text {
                font-size: 0.9em;
            }

            .last-update {
                font-size: 0.9em;
            }
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 1.3em;
            }

            .tank-container {
                width: 140px;
                height: 220px;
            }

            .course-name {
                font-size: 1.2em;
            }
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(10, 0, 21, 0.9);
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.35),
                        inset 0 0 15px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00bfff, #00d4ff, #5dd9ff, #87ceeb);
            transition: width 1s ease-in-out;
            border-radius: 13px;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.6);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9),
                         0 0 10px rgba(0, 212, 255, 0.9);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <svg class="mars-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="marsGradient" cx="35%" cy="35%">
                            <stop offset="0%" style="stop-color:#ff8c5a;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#e74c3c;stop-opacity:1" />
                            <stop offset="80%" style="stop-color:#c0392b;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8b1a0f;stop-opacity:1" />
                        </radialGradient>
                    </defs>
                    <!-- Planeta Marte -->
                    <circle cx="50" cy="50" r="48" fill="url(#marsGradient)" stroke="#ff6b4a" stroke-width="2"/>
                    <!-- Cráteres -->
                    <circle cx="30" cy="35" r="10" fill="#a0321e" opacity="0.6"/>
                    <circle cx="68" cy="42" r="7" fill="#a0321e" opacity="0.5"/>
                    <circle cx="48" cy="68" r="12" fill="#a0321e" opacity="0.7"/>
                    <circle cx="65" cy="65" r="6" fill="#8b1a0f" opacity="0.5"/>
                    <!-- Valles Marineris (cicatriz grande) -->
                    <ellipse cx="50" cy="50" rx="25" ry="4" fill="#7a1610" opacity="0.4" transform="rotate(-20 50 50)"/>
                    <!-- Casquete polar -->
                    <ellipse cx="50" cy="15" rx="18" ry="8" fill="#ffffff" opacity="0.4"/>
                </svg>
                BREATHE - MARS COLONY 💨
            </h1>
            <p class="subtitle">BASE MARS 2056 - Estado de Tanques de Oxígeno</p>
            <div class="stats">
                <div class="stat-item">
                    <div>Oxígeno Total</div>
                    <div class="stat-value" id="totalPoints">0</div>
                </div>
                <div class="stat-item">
                    <div>Códigos Activados</div>
                    <div class="stat-value" id="usedCodes">0</div>
                </div>
                <div class="stat-item">
                    <div>Supervivencia</div>
                    <div class="stat-value" id="globalProgress">0%</div>
                </div>
            </div>
        </header>

        <div class="tanks-grid" id="tanksGrid"></div>

        <div class="last-update">
            Última actualización: <span id="lastUpdate">--:--:--</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRbu8NsRZuvn1hVKoAYztaeyXEG_9g0KI",
            authDomain: "breath-8f51d.firebaseapp.com",
            databaseURL: "https://breath-8f51d-default-rtdb.firebaseio.com",
            projectId: "breath-8f51d",
            storageBucket: "breath-8f51d.firebasestorage.app",
            messagingSenderId: "115092733788",
            appId: "1:115092733788:web:908339b70a0f8113318b99"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        const allCourses = ['3º ESO A', '3º ESO B', '3º ESO C', '3º ESO D', '3º ESO E', '3º ESO F'];
    </script>
    
    <script>
        function calculateRanks(sortedCourses) {
            const ranks = [];
            let currentRank = 1;
            
            for (let i = 0; i < sortedCourses.length; i++) {
                const [course, points] = sortedCourses[i];
                
                if (i > 0 && sortedCourses[i][1] === sortedCourses[i-1][1]) {
                    ranks.push({ course, points, rank: ranks[i-1].rank });
                } else {
                    ranks.push({ course, points, rank: currentRank });
                }
                currentRank++;
            }
            
            return ranks;
        }

        function getMedalByRank(rank) {
            const medals = {
                1: '🥇',
                2: '🥈',
                3: '🥉',
                4: '4️⃣',
                5: '5️⃣'
            };
            return medals[rank] || '📊';
        }

        function getClassByRank(rank) {
            if (rank === 1) return 'first';
            if (rank === 2) return 'second';
            if (rank === 3) return 'third';
            return '';
        }

        async function updateDisplay() {
            try {
                const snapshot = await db.ref('/').once('value');
                const data = snapshot.val() || {};
                
                let coursePoints = {};
                
                const firebaseCourses = data.courses || {};
                allCourses.forEach(course => {
                    const courseKey = course.replace(/\s/g, '_');
                    coursePoints[course] = firebaseCourses[courseKey] || 0; 
                });

                const usedCodes = data.usedCodes || [];
                
                const totalPoints = Object.values(coursePoints).reduce((sum, points) => sum + points, 0);
                
                document.getElementById('totalPoints').textContent = totalPoints;
                document.getElementById('usedCodes').textContent = usedCodes.length;
                
                const globalProgress = Math.min(100, Math.floor((totalPoints / 1000) * 100));
                document.getElementById('globalProgress').textContent = globalProgress + '%';
                
                const sortedCourses = Object.entries(coursePoints).sort((a, b) => b[1] - a[1]);
                
                const rankedCourses = calculateRanks(sortedCourses);
                
                const tanksGrid = document.getElementById('tanksGrid');
                tanksGrid.innerHTML = '';
                
                rankedCourses.forEach(({ course, points, rank }) => {
                    const percentage = Math.min(100, Math.floor((points / 1000) * 100));
                    const medal = getMedalByRank(rank);
                    const rankClass = getClassByRank(rank);
                    
                    const tankCard = document.createElement('div');
                    tankCard.className = `tank-card ${rankClass}`;
                    tankCard.innerHTML = `
                        <div class="medal">${medal}</div>
                        <div class="course-name">${course}</div>
                        <div class="tank-container">
                            <div class="oxygen-fill" style="height: ${percentage}%"></div>
                            <div class="tank-percentage">${percentage}%</div>
                        </div>
                        <div class="tank-stats">
                            <div class="points">${points} pts</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percentage}%"></div>
                                <div class="progress-text">${percentage}%</div>
                            </div>
                        </div>
                    `;
                    tanksGrid.appendChild(tankCard);
                });
                
                const now = new Date();
                document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('es-ES');
                
            } catch (error) {
                console.error("Error al obtener datos de Firebase:", error);
                document.getElementById('lastUpdate').textContent = 'Error de conexión (' + new Date().toLocaleTimeString('es-ES') + ')';
            }
        }

        updateDisplay();
        setInterval(updateDisplay, 3000);
    </script>
</body>
</html>
