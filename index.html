<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathe - Estudiantes</title> 
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .subtitle {
            font-size: 1.2em;
            color: #a8dadc;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #a8dadc;
            font-weight: bold;
            font-size: 1.1em;
        }

        select, input {
            width: 100%;
            padding: 15px;
            border: 3px solid #4ecdc4;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
            transform: scale(1.02);
        }

        select option {
            background: #302b63;
            color: white;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 1.1em;
        }

        .success {
            background: rgba(76, 175, 80, 0.3);
            border: 3px solid #4caf50;
            color: #a5d6a7;
            animation: slideIn 0.5s ease-out;
        }

        .error {
            background: rgba(244, 67, 54, 0.3);
            border: 3px solid #f44336;
            color: #ef9a9a;
            animation: shake 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .info-box {
            background: rgba(78, 205, 196, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            border-left: 5px solid #4ecdc4;
        }

        .info-box p {
            margin: 8px 0;
            color: #a8dadc;
            font-size: 1em;
        }

        .link {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: rgba(78, 205, 196, 0.2);
            border-radius: 10px;
        }

        .link a {
            color: #4ecdc4;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
        }

        .link a:hover {
            color: #ff6b6b;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌬️ BREATHE 💨</h1>
            <p class="subtitle">Ayuda a tu curso 3º ESO a conseguir más oxígeno</p>
        </header>

        <div class="card">
            <h2 style="color: #4ecdc4; margin-bottom: 25px; text-align: center;">Introduce tu código</h2>
            
            <form id="codeForm">
                <div class="form-group">
                    <label for="courseSelect">🎓 Selecciona tu curso:</label>
                    <select id="courseSelect" required>
                        <option value="">-- Elige tu curso --</option>
                        <option value="3º ESO A">3º ESO A</option>
                        <option value="3º ESO B">3º ESO B</option>
                        <option value="3º ESO C">3º ESO C</option>
                        <option value="3º ESO D">3º ESO D</option>
                        <option value="3º ESO E">3º ESO E</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="codeInput">🔑 Código de tarea:</label>
                    <input 
                        type="text" 
                        id="codeInput" 
                        placeholder="Ej: MARS-AB1234" 
                        required
                        style="text-transform: uppercase;">
                </div>

                <button type="submit">💨 Añadir Oxígeno</button>
            </form>

            <div id="message"></div>

            <div class="info-box">
                <p><strong>ℹ️ Cómo funciona:</strong></p>
                <p>✅ Completa las tareas asignadas</p>
                <p>✅ Recibe códigos de tus profesores</p>
                <p>✅ Introduce el código aquí</p>
                <p>✅ ¡Suma oxígeno para tu curso!</p>
            </div>

            <div class="link">
                <a href="pantalla.html" target="_blank">👁️ Ver pantalla de puntuación</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // 2. Tu Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRbu8NsRZuvn1hVKoAYztaeyXEG_9g0KI",
            authDomain: "breath-8f51d.firebaseapp.com",
            databaseURL: "https://breath-8f51d-default-rtdb.firebaseio.com",
            projectId: "breath-8f51d",
            storageBucket: "breath-8f51d.firebasestorage.app",
            messagingSenderId: "115092733788",
            appId: "1:115092733788:web:908339b70a0f8113318b99"
        };

        // Inicializar Firebase y obtener la referencia a la base de datos
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
    
    <script>
        // Función para normalizar el nombre del curso (reemplaza espacios por _ para usar en la clave de Firebase)
        function normalizeCourseName(course) {
            return course.replace(/\s/g, '_');
        }

        // Convertir a mayúsculas automáticamente
        document.getElementById('codeInput').addEventListener('input', function(e) {
            e.target.value = e.target.value.toUpperCase();
        });

        // Cargar códigos válidos desde el archivo JSON
        async function loadValidCodes() {
            try {
                const response = await fetch('codigos.json');
                if (!response.ok) {
                    throw new Error('No se pudo cargar el archivo de códigos');
                }
                const data = await response.json();
                return data.codes;
            } catch (error) {
                console.error('Error cargando códigos:', error);
                return [];
            }
        }
        
        // Función para obtener los datos de la BD y, si no existen, inicializarlos
        async function getDataFromDB() {
            // Intenta leer la base de datos
            const snapshot = await db.ref('/').once('value');
            let data = snapshot.val();
            
            // Si la base de datos está vacía, la inicializamos con 0 puntos y sin códigos usados.
            if (!data || !data.courses || !data.usedCodes) {
                data = {
                    courses: {
                        '3º_ESO_A': 0,
                        '3º_ESO_B': 0,
                        '3º_ESO_C': 0,
                        '3º_ESO_D': 0,
                        '3º_ESO_E': 0
                    },
                    usedCodes: []
                };
                // Guardamos la estructura inicial en la BD
                await db.ref('/').set(data);
            }
            return data;
        }

        // Procesar código
        document.getElementById('codeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const course = document.getElementById('courseSelect').value;
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            const messageDiv = document.getElementById('message');
            const courseKey = normalizeCourseName(course); // Curso normalizado para la clave de Firebase
            
            if (course === "") {
                messageDiv.innerHTML = '<div class="message error">❌ Por favor, selecciona tu curso.</div>';
                setTimeout(() => messageDiv.innerHTML = '', 4000);
                return;
            }
            
            // 1. Cargar datos actuales de la BD
            let data;
            try {
                data = await getDataFromDB();
            } catch (error) {
                messageDiv.innerHTML = '<div class="message error">❌ Error de conexión con la base de datos. Inténtalo de nuevo. (Revisa las Reglas de Firebase)</div>';
                console.error(error);
                return;
            }
            
            // 2. Verificar si el código ya fue usado (en la BD)
            if (data.usedCodes && data.usedCodes.includes(code)) {
                messageDiv.innerHTML = '<div class="message error">❌ Este código ya ha sido utilizado por alguien</div>';
                setTimeout(() => messageDiv.innerHTML = '', 4000);
                return;
            }
            
            // 3. Cargar códigos válidos del JSON
            const validCodes = await loadValidCodes();
            const codeObj = validCodes.find(c => c.code === code);
            
            if (!codeObj) {
                messageDiv.innerHTML = '<div class="message error">❌ Código inválido. Verifica que lo hayas escrito bien</div>';
                setTimeout(() => messageDiv.innerHTML = '', 4000);
                return;
            }
            
            // 4. Lógica para la ACUMULACIÓN y guardado en Firebase
            
            // Obtener puntos actuales usando la clave normalizada, asumiendo 0 si no existe
            const currentPoints = data.courses[courseKey] || 0; 
            const newTotalPoints = currentPoints + codeObj.points; // Nuevo total
            
            try {
                // Actualizar puntos del curso en Firebase (USANDO FIREBASE)
                await db.ref('courses/' + courseKey).set(newTotalPoints);
                
                // Añadir código a la lista de códigos usados (USANDO FIREBASE)
                if (!data.usedCodes) data.usedCodes = [];
                data.usedCodes.push(code);
                await db.ref('usedCodes').set(data.usedCodes);
                
                messageDiv.innerHTML = `
                    <div class="message success">
                        ✅ ¡Excelente ${course}! 
                        <br>Has ganado <strong>${codeObj.points} puntos</strong> de oxígeno
                        <br><em>${codeObj.description}</em>
                    </div>
                `;

            } catch (error) {
                messageDiv.innerHTML = '<div class="message error">❌ Error al guardar puntos en la nube.</div>';
                console.error("Error de escritura en Firebase:", error);
                return;
            }

            // Limpiar formulario
            document.getElementById('codeInput').value = '';
            document.getElementById('courseSelect').selectedIndex = 0;
            
            // Ocultar mensaje después de 6 segundos
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 6000);
        });
        
        // Llama a la inicialización para asegurar que la estructura esté en Firebase
        getDataFromDB(); 
    </script>
</body>
</html>
